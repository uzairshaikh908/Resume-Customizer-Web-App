services:
  - type: web
    name: resumeai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
